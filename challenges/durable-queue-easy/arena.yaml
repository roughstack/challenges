apiVersion: bytearena.dev/v1
kind: Arena
metadata:
  id: durable-queue-easy
  version: 1.0.0
  title: Durable Work Queue
  visibility: public
  mode: practice
  difficulty: easy
  tags: [concurrency, backpressure, go]
submission:
  language: go
  entrypoint: starter/queue.go
  interface: bytearena.durablequeue.Queue/v1
build:
  command: ["go", "test", "./challenges/durable-queue-easy/..."]
  timeoutSeconds: 60
run:
  command: ["go", "run", "./challenges/durable-queue-easy/cmd/smoke", "--seed", "12345"]
  protocol: bytearena.result/v1
  timeoutSeconds: 120
resources:
  cpuCount: 1
  memoryMiB: 256
  diskMiB: 512
  network: disabled
  maxProcesses: 16
evaluation:
  correctnessGate: true
  publicSuite: public-v1
  officialSuiteContract: official-v1
  repetitions: 3
  warmupRuns: 1
metrics:
  - id: completed_jobs
    unit: jobs
    direction: maximize
    weight: 0.45
  - id: logical_queue_wait
    unit: ticks
    direction: minimize
    weight: 0.25
  - id: sync_work
    unit: operations
    direction: minimize
    weight: 0.15
  - id: peak_bytes
    unit: bytes
    direction: minimize
    weight: 0.15
scoring:
  model: weighted-normalized/v1
  config: scoring.yaml
capabilities: [deterministic-workload, exact-byte-accounting]
