apiVersion: bytearena.dev/v1
kind: Arena
metadata:
  id: journal-recovery-easy
  version: 1.0.0
  title: Journal Recovery
  visibility: public
  mode: practice
  difficulty: easy
  tags: [storage, journal, checksum, recovery, go]
submission:
  language: go
  entrypoint: starter/journal.go
  interface: bytearena.journal.Journal/v1
build:
  command: ["go", "test", "./arenas/journal-recovery-easy/..."]
  timeoutSeconds: 60
run:
  command: ["go", "run", "./arenas/journal-recovery-easy/cmd/smoke", "--seed", "12345"]
  protocol: bytearena.result/v1
  timeoutSeconds: 120
resources:
  cpuCount: 1
  memoryMiB: 256
  diskMiB: 512
  network: disabled
  maxProcesses: 16
evaluation:
  correctnessGate: true
  publicSuite: public-v1
  officialSuiteContract: official-v1
  repetitions: 3
  warmupRuns: 1
metrics:
  - id: append_throughput
    unit: records-per-1000-ops
    direction: maximize
    weight: 0.35
  - id: recovery_bytes_read
    unit: bytes
    direction: minimize
    weight: 0.25
  - id: write_overhead
    unit: operations
    direction: minimize
    weight: 0.20
  - id: allocations
    unit: allocations
    direction: minimize
    weight: 0.10
  - id: disk_bytes
    unit: bytes
    direction: minimize
    weight: 0.10
scoring:
  model: weighted-normalized/v1
  config: scoring.yaml
capabilities: [deterministic-workload, deterministic-faults, exact-byte-accounting]
