apiVersion: bytearena.dev/v1
kind: Arena
metadata:
  id: stream-windows-easy
  version: 1.0.0
  title: Stream Windows — Easy
  visibility: public
  mode: practice
  difficulty: easy
  tags: [streaming, event-time, windows, go]
submission:
  language: go
  entrypoint: starter/starter.go
  interface: bytearena.streamwindows.Operator/v1
build:
  command: ["go", "test", "./arenas/stream-windows-easy/..."]
  timeoutSeconds: 60
run:
  command: ["go", "run", "./arenas/stream-windows-easy/cmd/smoke", "--seed", "12345"]
  protocol: bytearena.result/v1
  timeoutSeconds: 120
resources:
  cpuCount: 1
  memoryMiB: 256
  diskMiB: 512
  network: disabled
  maxProcesses: 16
evaluation:
  correctnessGate: true
  publicSuite: public-v1
  officialSuiteContract: official-v1
  repetitions: 3
  warmupRuns: 1
metrics:
  - id: events_per_second
    unit: events/second
    direction: maximize
    weight: 0.45
  - id: peak_state_bytes
    unit: bytes
    direction: minimize
    weight: 0.30
  - id: output_delay
    unit: ticks
    direction: minimize
    weight: 0.15
  - id: alloc_bytes
    unit: bytes
    direction: minimize
    weight: 0.10
scoring:
  model: weighted-normalized/v1
  config: scoring.yaml
capabilities: [deterministic-workload]
