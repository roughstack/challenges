apiVersion: bytearena.dev/v1
kind: Arena
metadata:
  id: deadline-scheduler-easy
  version: 1.0.0
  title: Deadline Scheduler — Easy
  visibility: public
  mode: practice
  difficulty: easy
  tags: [scheduling, fairness, virtual-clock, go]
submission:
  language: go
  entrypoint: starter/starter.go
  interface: bytearena.deadlinescheduler.Scheduler/v1
build:
  command: ["go", "test", "./arenas/deadline-scheduler-easy/..."]
  timeoutSeconds: 60
run:
  command: ["go", "run", "./arenas/deadline-scheduler-easy/cmd/smoke", "--seed", "12345"]
  protocol: bytearena.result/v1
  timeoutSeconds: 120
resources:
  cpuCount: 1
  memoryMiB: 256
  diskMiB: 512
  network: disabled
  maxProcesses: 16
evaluation:
  correctnessGate: true
  publicSuite: public-v1
  officialSuiteContract: official-v1
  repetitions: 3
  warmupRuns: 1
metrics:
  - id: mean_flow_ticks
    unit: ticks
    direction: minimize
    weight: 0.40
  - id: p95_flow_ticks
    unit: ticks
    direction: minimize
    weight: 0.25
  - id: starvation_penalty
    unit: ticks
    direction: minimize
    weight: 0.20
  - id: scheduler_work
    unit: operations
    direction: minimize
    weight: 0.10
  - id: peak_state_bytes
    unit: bytes
    direction: minimize
    weight: 0.05
scoring:
  model: weighted-normalized/v1
  config: scoring.yaml
capabilities: [deterministic-workload, deterministic-virtual-clock]
