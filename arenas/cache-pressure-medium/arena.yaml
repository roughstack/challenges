apiVersion: bytearena.dev/v1
kind: Arena
metadata:
  id: cache-pressure-medium
  version: 1.0.0
  title: Cache Pressure — Medium
  visibility: public
  mode: practice
  difficulty: medium
  tags: [cache, locality, go, expiry, admission]
submission:
  language: go
  entrypoint: starter/cache.go
  interface: bytearena.cache.Cache/v1
build:
  command: ["go", "test", "./arenas/cache-pressure-medium/..."]
  timeoutSeconds: 60
run:
  command: ["go", "run", "./arenas/cache-pressure-medium/cmd/smoke", "--seed", "12345"]
  protocol: bytearena.result/v1
  timeoutSeconds: 120
resources:
  cpuCount: 1
  memoryMiB: 256
  diskMiB: 512
  network: disabled
  maxProcesses: 16
evaluation:
  correctnessGate: true
  publicSuite: public-v1
  officialSuiteContract: official-v1
  repetitions: 3
  warmupRuns: 1
metrics:
  - id: weighted_backing_cost
    unit: cost
    direction: minimize
    weight: 0.5
  - id: byte_hit_rate
    unit: basis-points
    direction: maximize
    weight: 0.2
  - id: request_hit_rate
    unit: basis-points
    direction: maximize
    weight: 0.1
  - id: logical_policy_work
    unit: operations
    direction: minimize
    weight: 0.1
  - id: peak_memory_headroom
    unit: bytes
    direction: minimize
    weight: 0.1
scoring:
  model: weighted-normalized/v1
  config: scoring.yaml
capabilities: [deterministic-workload, exact-byte-accounting, ttl-expiry, scan-resistance]
